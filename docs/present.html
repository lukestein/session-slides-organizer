<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Present slides from Slide Organizer.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; style-src-attr 'unsafe-inline'; connect-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Presenting</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./present.mjs"></script>
</head>
<body class="deck-body">
  <div class="deck-page">
    <div class="deck-bar">
      <span class="deck-brand" title="Slide Organizer">
        <svg aria-hidden="true" viewBox="0 0 32 32" width="20" height="20">
          <rect width="32" height="32" rx="7" fill="#006644"/>
          <rect x="11" y="5.5" width="16" height="11.5" rx="2" fill="#5fa47f"/>
          <rect x="8.5" y="9.25" width="16" height="11.5" rx="2" fill="#a9d3b9"/>
          <rect x="6" y="13" width="16" height="11.5" rx="2" fill="#fff"/>
        </svg>
        <span class="site-address">slide<b>org</b><i>.org</i></span>
      </span>
      <span class="deck-title" id="deck-title"></span>
      <span class="deck-source" id="deck-source" hidden></span>
      <span class="deck-count" id="deck-count" role="status"></span>
      <a class="deck-button" id="deck-original" target="_blank" rel="noopener"
        title="Open the original PDF in the browser's own viewer, for search and printing"
        hidden>Open original</a>
      <a class="deck-button" id="deck-download" download hidden>Download</a>
      <button type="button" class="deck-button" id="deck-presenter"
        title="Notes, the next slide and a timer here, with the slides on a second screen">Presenter view</button>
      <button type="button" class="deck-button" id="deck-slides"
        title="Show all slides (G). B blanks the screen black, W white.">All slides</button>
      <button type="button" class="deck-button" id="deck-fullscreen">Full screen</button>
    </div>
    <div class="deck-stage" id="deck-stage">
      <p class="deck-message">Opening presentation…</p>
    </div>
    <aside class="deck-side" id="deck-side" aria-label="Presenter view" hidden>
      <div class="deck-clock">
        <span class="deck-elapsed" id="deck-elapsed" title="Time since presenter view started">0:00</span>
        <button type="button" class="deck-button deck-timer-close" id="deck-timer-close"
          aria-label="Hide the timer" title="Hide the timer">×</button>
        <button type="button" class="deck-button" id="deck-restart" title="Start the timer again">Restart</button>
        <button type="button" class="deck-button" id="deck-timer-show" hidden>Show timer</button>
        <time class="deck-time" id="deck-time"></time>
      </div>
      <section class="deck-upnext" aria-labelledby="deck-upnext-heading">
        <h2 id="deck-upnext-heading">Next</h2>
        <p class="deck-builds" id="deck-builds" hidden></p>
        <div class="deck-upnext-slide" id="deck-upnext"></div>
      </section>
      <section class="deck-notes" id="deck-notes-section" aria-labelledby="deck-notes-heading" hidden>
        <h2 id="deck-notes-heading">Notes</h2>
        <div class="deck-notes-text" id="deck-notes"></div>
      </section>
      <div class="deck-screen" id="deck-screen">
        <p id="deck-screen-status" role="status"></p>
        <button type="button" class="deck-button" id="deck-screen-action" hidden></button>
      </div>
    </aside>
    <button type="button" class="deck-edge deck-prev" id="deck-prev" aria-label="Previous slide"></button>
    <button type="button" class="deck-edge deck-next" id="deck-next" aria-label="Next slide"></button>
    <div class="deck-blank" id="deck-blank" hidden></div>
    <div class="deck-picker" id="deck-picker" aria-label="Slides"></div>

    <div class="deck-help" id="deck-help" role="dialog" aria-label="Keyboard shortcuts" hidden>
      <dl class="deck-help-list">
        <dt><kbd>→</kbd><kbd>↓</kbd><kbd>Space</kbd></dt><dd>Next slide or build</dd>
        <dt><kbd>←</kbd><kbd>↑</kbd></dt><dd>Previous</dd>
        <dt><kbd>Page Up</kbd><kbd>Page Down</kbd></dt><dd>Previous / next</dd>
        <dt><kbd>Home</kbd><kbd>End</kbd></dt><dd>First / last slide</dd>
        <dt><kbd>B</kbd><kbd>W</kbd></dt><dd>Blank the screen black or white</dd>
        <dt class="single-only"><kbd>G</kbd></dt><dd class="single-only">Show all slides</dd>
        <dt><kbd>?</kbd></dt><dd>This guide</dd>
        <dt><kbd>Esc</kbd></dt><dd>Close this, or the slide picker</dd>
      </dl>
    </div>
  </div>
</body>
</html>
